name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build_and_test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'pnpm'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: 'pip'

      - name: Install Node dependencies
        run: pnpm install

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ./apps/api[dev]

      - name: Run Ruff (Python Linting & Formatting)
        run: |
          cd apps/api
          ruff check .
          ruff format --check .

      - name: Run MyPy (Python Type Checking)
        run: |
          cd apps/api
          mypy src

      - name: Run ESLint (Frontend Linting)
        run: pnpm --filter web lint

      - name: Run TypeScript Type Check (Frontend)
        run: pnpm --filter web typecheck

      - name: Build Frontend
        run: pnpm --filter web build

      - name: Validate Backend Startup
        run: |
          cd apps/api
          python -c "from src.main import app"
